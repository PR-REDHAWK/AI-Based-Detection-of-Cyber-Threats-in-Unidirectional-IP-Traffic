version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: oracle_shield_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./oracleshield.db:/app/oracleshield.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: oracle_shield_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
